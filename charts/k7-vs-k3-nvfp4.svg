<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace">
  <rect width="900" height="470" fill="#fcfcfd"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#10141a" font-family="IBM Plex Sans Condensed, Helvetica, sans-serif">NVFP4: k=7 to k=3 recovers +87% at four streams</text>
  <text x="30" y="54" font-size="12.5" fill="#4d5766">Batch throughput, cold arm · 8k context · 256 tokens forced · median of 3 · spread 0.2–1.0 at C4</text>

  <line x1="90" y1="360" x2="820" y2="360" stroke="#c8ced7"/>
  <line x1="90" y1="300" x2="820" y2="300" stroke="#dde1e7"/>
  <line x1="90" y1="240" x2="820" y2="240" stroke="#dde1e7"/>
  <line x1="90" y1="180" x2="820" y2="180" stroke="#dde1e7"/>
  <line x1="90" y1="120" x2="820" y2="120" stroke="#dde1e7"/>
  <text x="82" y="364" font-size="11" fill="#78828f" text-anchor="end">0</text>
  <text x="82" y="304" font-size="11" fill="#78828f" text-anchor="end">5</text>
  <text x="82" y="244" font-size="11" fill="#78828f" text-anchor="end">10</text>
  <text x="82" y="184" font-size="11" fill="#78828f" text-anchor="end">15</text>
  <text x="82" y="124" font-size="11" fill="#78828f" text-anchor="end">20</text>
  <text x="30" y="88" font-size="11.5" font-weight="600" fill="#4d5766">tok/s</text>
  <line x1="90" y1="70" x2="90" y2="360" stroke="#c8ced7"/>

  <rect x="150" y="189.6" width="70" height="170.4" rx="5" fill="#b9c0cb"/>
  <rect x="228" y="183.6" width="70" height="176.4" rx="5" fill="#eb6834"/>
  <text x="185" y="180" font-size="15" font-weight="700" fill="#5c6674" text-anchor="middle">14.2</text>
  <text x="263" y="174" font-size="15" font-weight="700" fill="#eb6834" text-anchor="middle">14.7</text>
  <text x="224" y="386" font-size="12.5" font-weight="600" fill="#4d5766" text-anchor="middle">1 stream</text>
  <text x="224" y="406" font-size="12" font-weight="700" fill="#78828f" text-anchor="middle">+3%</text>

  <rect x="390" y="153.6" width="70" height="206.4" rx="5" fill="#b9c0cb"/>
  <rect x="468" y="116.4" width="70" height="243.6" rx="5" fill="#eb6834"/>
  <text x="425" y="144" font-size="15" font-weight="700" fill="#5c6674" text-anchor="middle">17.2</text>
  <text x="503" y="107" font-size="15" font-weight="700" fill="#eb6834" text-anchor="middle">20.3</text>
  <text x="464" y="386" font-size="12.5" font-weight="600" fill="#4d5766" text-anchor="middle">2 streams</text>
  <text x="464" y="406" font-size="12" font-weight="700" fill="#c2521f" text-anchor="middle">+18%</text>

  <rect x="630" y="199.2" width="70" height="160.8" rx="5" fill="#b9c0cb"/>
  <rect x="708" y="60"    width="70" height="300"   rx="5" fill="#eb6834"/>
  <text x="665" y="190" font-size="15" font-weight="700" fill="#5c6674" text-anchor="middle">13.4</text>
  <text x="743" y="51" font-size="17" font-weight="700" fill="#eb6834" text-anchor="middle">25.0</text>
  <text x="704" y="386" font-size="12.5" font-weight="600" fill="#4d5766" text-anchor="middle">4 streams</text>
  <text x="704" y="406" font-size="14" font-weight="700" fill="#c2521f" text-anchor="middle">+87%</text>

  <line x1="30" y1="424" x2="870" y2="424" stroke="#dde1e7"/>
  <g font-size="12" font-weight="500">
    <rect x="34" y="440" width="22" height="10" rx="2" fill="#b9c0cb"/>
    <text x="64" y="449" fill="#4d5766">k=7 (recipe default)</text>
    <rect x="230" y="440" width="22" height="10" rx="2" fill="#eb6834"/>
    <text x="260" y="449" fill="#4d5766">k=3</text>
    <text x="330" y="449" fill="#78828f">Does not fix prefix caching — warm stays equal to cold.</text>
  </g>
</svg>
