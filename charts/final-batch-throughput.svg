  <line x1="90" y1="66" x2="90" y2="420" stroke="#c8ced7"/>

  <text x="240" y="452" font-size="13" font-weight="600" fill="#4d5766" text-anchor="middle">COLD prefix</text>
  <text x="680" y="452" font-size="13" font-weight="600" fill="#4d5766" text-anchor="middle">WARM prefix</text>
  <line x1="460" y1="66" x2="460" y2="432" stroke="#c8ced7" stroke-dasharray="4 4"/>

