  <text x="783" y="438" font-size="11.5" fill="#78828f" text-anchor="middle">C4</text>

  <line x1="30" y1="474" x2="870" y2="474" stroke="#dde1e7"/>
  <g font-size="12" font-weight="500">
    <rect x="34" y="492" width="20" height="10" rx="2" fill="#eb6834"/>
    <text x="62" y="501" fill="#4d5766">NVFP4 (k=3, MNBT 8192)</text>
    <rect x="256" y="492" width="20" height="10" rx="2" fill="#2a78d6"/>
    <text x="284" y="501" fill="#4d5766">EXL3 (draft_tp=2)</text>
  </g>
  <text x="30" y="524" font-size="11.5" fill="#78828f">Cold: ranges never overlap — NVFP4 wins. Warm C4: EXL3's worst run (36.4) beats NVFP4's best (29.7). Warm C1/C2 overlap — no winner claimed.</text>
</svg>
